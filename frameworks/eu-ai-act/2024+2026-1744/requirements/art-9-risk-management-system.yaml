id: eu-ai-act/2024+2026-1744/art-9
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-9"
title: Risk management system (high-risk)
type: obligation
authority: legal
text_summary: >
  Providers of high-risk AI systems establish, document and maintain a
  continuous, iterative risk management process across the system lifecycle:
  identify and analyze foreseeable risks, estimate and evaluate them, adopt
  targeted risk management measures, and test against preliminarily defined
  metrics.
applicability:
  ai_roles: [provider]
  min_maturity: L2
domains: [risk-impact]
evidence_expectations:
  - "Documented lifecycle risk management process per high-risk system"
  - "Risk analysis and mitigation records with testing against defined metrics"
applicable_from: "2027-12-02"
tags: [hrais]
