id: eu-ai-act/2024+2026-1744/art-14
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-14"
title: Human oversight (high-risk)
type: obligation
authority: legal
text_summary: >
  High-risk systems are designed so natural persons can effectively oversee
  them: understand capacities and limits, monitor operation, interpret output,
  decide not to use or to disregard output, and intervene or stop the system.
applicability:
  ai_roles: [provider, deployer]
  min_maturity: L2
domains: [responsible-use, ai-lifecycle]
evidence_expectations:
  - "Oversight measures designed into the system (provider) and assigned to competent persons (deployer)"
  - "Demonstrated intervention/stop capability"
applicable_from: "2027-12-02"
tags: [hrais, oversight]
