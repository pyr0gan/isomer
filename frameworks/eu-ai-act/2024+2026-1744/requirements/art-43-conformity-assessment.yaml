id: eu-ai-act/2024+2026-1744/art-43
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-43"
title: Conformity assessment (high-risk)
type: obligation
authority: legal
text_summary: >
  High-risk systems undergo the applicable conformity assessment procedure
  before placing on the market or putting into service, and re-assessment on
  substantial modification.
applicability:
  ai_roles: [provider]
  min_maturity: L2
domains: [monitoring-improvement]
evidence_expectations:
  - "Conformity assessment records per system version with substantial-modification triggers defined"
applicable_from: "2027-12-02"
tags: [hrais, conformity]
