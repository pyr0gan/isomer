id: eu-ai-act/2024+2026-1744/art-11
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-11"
title: Technical documentation (high-risk)
type: obligation
authority: legal
text_summary: >
  Providers draw up technical documentation before placing a high-risk system
  on the market and keep it current, sufficient to demonstrate conformity and
  enable authorities to assess it.
applicability:
  ai_roles: [provider]
  min_maturity: L2
domains: [ai-lifecycle, transparency-communication]
evidence_expectations:
  - "Technical documentation pack per high-risk system, versioned with the system"
applicable_from: "2027-12-02"
tags: [hrais, documentation]
