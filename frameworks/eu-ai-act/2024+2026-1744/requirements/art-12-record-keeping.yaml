id: eu-ai-act/2024+2026-1744/art-12
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-12"
title: Record-keeping (high-risk)
type: obligation
authority: legal
text_summary: >
  High-risk systems technically allow automatic recording of events (logs)
  over their lifetime, appropriate to intended purpose, to ensure traceability
  of functioning.
applicability:
  ai_roles: [provider]
  min_maturity: L2
domains: [ai-lifecycle, security-operations]
evidence_expectations:
  - "Logging capability designed into the system with event coverage spec"
applicable_from: "2027-12-02"
tags: [hrais, logging]
