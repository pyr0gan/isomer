id: eu-ai-act/2024+2026-1744/art-73
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-73"
title: Serious incident reporting (high-risk)
type: obligation
authority: legal
text_summary: >
  Providers report serious incidents involving high-risk systems to market
  surveillance authorities within the applicable deadlines, investigate, and
  take corrective action; deployers inform providers of identified serious
  incidents.
applicability:
  ai_roles: [provider, deployer]
  min_maturity: L2
domains: [security-operations, transparency-communication]
evidence_expectations:
  - "Serious-incident definition and reporting procedure with deadline handling"
  - "Incident register with authority notifications where triggered"
applicable_from: "2027-12-02"
tags: [hrais, incidents]
