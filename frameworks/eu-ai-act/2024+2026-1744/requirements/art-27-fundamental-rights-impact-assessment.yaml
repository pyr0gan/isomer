id: eu-ai-act/2024+2026-1744/art-27
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-27"
title: Fundamental rights impact assessment (certain deployers)
type: obligation
authority: legal
text_summary: >
  Before first use of certain high-risk systems, deployers that are public-law
  bodies or private entities providing public services — and deployers using
  systems for credit scoring/creditworthiness or life and health insurance
  risk assessment and pricing — assess the impact on fundamental rights:
  processes, categories of affected persons, specific risks of harm, oversight
  measures and mitigation/governance arrangements.
applicability:
  ai_roles: [deployer]
  min_maturity: L2
domains: [risk-impact, responsible-use]
evidence_expectations:
  - "Completed FRIA before first use for in-scope deployments"
  - "FRIA linked to oversight and mitigation arrangements (42005-shaped impact assessment extends to cover this)"
applicable_from: "2027-12-02"
tags: [hrais, fria]
