id: eu-ai-act/2024+2026-1744/art-17
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-17"
title: Quality management system (high-risk)
type: obligation
authority: legal
text_summary: >
  Providers put a documented quality management system in place covering
  regulatory compliance strategy, design and development controls, data
  management, risk management, post-market monitoring, incident reporting,
  communication with authorities, records, resources and accountability.
applicability:
  ai_roles: [provider]
  min_maturity: L2
domains: [leadership-policy, monitoring-improvement]
evidence_expectations:
  - "Documented QMS covering the required elements (a 42001-conformant AIMS is a strong chassis)"
applicable_from: "2027-12-02"
tags: [hrais, qms]
