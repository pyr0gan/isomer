id: eu-ai-act/2024+2026-1744/art-10
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-10"
title: Data and data governance (high-risk)
type: obligation
authority: legal
text_summary: >
  Training, validation and testing datasets for high-risk systems meet quality
  criteria: relevant data governance and management practices (design choices,
  collection, preparation, bias examination and mitigation), datasets
  relevant, sufficiently representative, and to the best extent possible free
  of errors and complete for the intended purpose.
applicability:
  ai_roles: [provider]
  min_maturity: L2
domains: [data-governance]
evidence_expectations:
  - "Dataset governance records covering collection, preparation and bias examination"
  - "Representativeness/quality assessment per training and testing set"
applicable_from: "2027-12-02"
tags: [hrais, data]
