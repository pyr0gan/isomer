id: eu-ai-act/2024+2026-1744/art-50
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-50"
title: Transparency obligations for certain AI systems
type: obligation
authority: legal
text_summary: >
  Systems interacting directly with people disclose that fact unless obvious;
  providers of systems generating synthetic audio, image, video or text mark
  outputs as artificially generated in machine-readable form; deployers
  disclose deepfakes and inform people subjected to emotion recognition or
  biometric categorisation; disclosures are clear and provided at first
  interaction/exposure.
applicability:
  ai_roles: [provider, deployer]
  min_maturity: L2
domains: [transparency-communication]
evidence_expectations:
  - "Interaction disclosure implemented where systems talk to people"
  - "Machine-readable marking of generated content (provider systems)"
  - "Deepfake/emotion-recognition disclosures where deployed"
applicable_from: "2026-08-02"
tags: [transparency]
