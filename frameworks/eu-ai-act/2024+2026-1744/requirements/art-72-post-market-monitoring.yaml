id: eu-ai-act/2024+2026-1744/art-72
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-72"
title: Post-market monitoring (high-risk)
type: obligation
authority: legal
text_summary: >
  Providers establish and document a post-market monitoring system
  proportionate to the technology and risks, actively collecting and analyzing
  performance data over the system's lifetime to evaluate continuing
  compliance and feed corrective action.
applicability:
  ai_roles: [provider]
  min_maturity: L2
domains: [monitoring-improvement, ai-lifecycle]
evidence_expectations:
  - "Post-market monitoring plan with collected-data analysis feeding corrective action"
applicable_from: "2027-12-02"
tags: [hrais, monitoring]
