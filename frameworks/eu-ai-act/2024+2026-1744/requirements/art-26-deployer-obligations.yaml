id: eu-ai-act/2024+2026-1744/art-26
framework: eu-ai-act
framework_version: "2024+2026-1744"
ref: "art-26"
title: Obligations of deployers (high-risk)
type: obligation
authority: legal
text_summary: >
  Deployers of high-risk systems use them per instructions for use; assign
  human oversight to competent, trained persons with authority; ensure input
  data under their control is relevant and sufficiently representative;
  monitor operation and suspend use and inform the provider on identified
  risk; retain automatically generated logs under their control for an
  appropriate period (at least six months unless law provides otherwise);
  inform workers before workplace deployment; and cooperate with authorities.
applicability:
  ai_roles: [deployer]
  min_maturity: L2
domains: [responsible-use, monitoring-improvement]
evidence_expectations:
  - "Use-per-instructions evidence per deployed high-risk system"
  - "Named, trained oversight persons with defined authority"
  - "Log retention meeting the minimum period"
  - "Worker information records for workplace deployments"
applicable_from: "2027-12-02"
tags: [hrais, deployer]
