id: annex-sl-core/1.0/8.1
framework: annex-sl-core
framework_version: "1.0"
ref: "8.1"
title: Operational planning and control
type: clause
authority: certifiable
text_summary: >
  Plan, implement and control the processes needed to meet requirements
  and to implement the actions determined in planning: establish criteria for
  the processes, implement control in accordance with the criteria, and keep
  documented information to the extent necessary for confidence that processes
  were carried out as planned. Control planned changes, review the
  consequences             of unintended changes, and ensure externally
  provided processes, products or             services relevant to the
  management system are controlled.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [monitoring-improvement, third-party]
evidence_expectations:
  - "Operating procedures with defined process criteria"
  - "Records demonstrating processes executed per criteria"
  - "Controls over outsourced or externally provided processes"
specializations:
  iso42001-2023: >
    Extends naturally into Annex A objectives A.6 (AI system lifecycle) and A.10
    (third-party relationships).
tags: [operations]
