id: annex-sl-core/1.0/6.1.2
framework: annex-sl-core
framework_version: "1.0"
ref: "6.1.2"
title: Risk assessment process
type: clause
authority: certifiable
text_summary: >
  Define and apply a risk assessment process with documented criteria,
  including risk acceptance criteria and criteria for when assessments are
  performed. The process must produce consistent, valid and comparable
  results,             identify risks, analyze their potential consequences
  and likelihood to             determine risk levels, and evaluate results
  against the criteria to             prioritize treatment.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [risk-impact]
evidence_expectations:
  - "Documented risk assessment methodology with acceptance criteria"
  - "Completed risk assessments demonstrating repeatable application"
  - "Risk register with analyzed and prioritized entries"
specializations:
  iso27001-2022: >
    Risks are assessed against loss of confidentiality, integrity and
    availability of information within scope.
  iso42001-2023: >
    Risks are assessed across the AI system lifecycle; Annex C provides
    objective and risk-source catalogs, and ISO/IEC 23894 supplies method
    guidance. 42001 additionally requires AI system impact assessments (its
    clause 6.1.4 and 8.4) — an extension point, not part of this core.
tags: [risk, methodology]
