id: annex-sl-core/1.0/7.5.3
framework: annex-sl-core
framework_version: "1.0"
ref: "7.5.3"
title: Documented information — control
type: clause
authority: certifiable
text_summary: >
  Control documented information so it is available and suitable where
  needed and adequately protected. Address distribution, access, retrieval and
  use; storage and preservation; change control; and retention and
  disposition.             Externally originated documents determined
  necessary are identified and             controlled.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [monitoring-improvement, data-governance]
evidence_expectations:
  - "Access controls on management system documentation"
  - "Retention and disposition schedule"
tags: [documentation, records]
