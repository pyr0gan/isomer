id: annex-sl-core/1.0/8.2
framework: annex-sl-core
framework_version: "1.0"
ref: "8.2"
title: Risk assessment in operation
type: clause
authority: certifiable
text_summary: >
  Perform risk assessments at planned intervals and when significant
  changes are proposed or occur, using the process defined in planning, and
  retain the results.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [risk-impact]
evidence_expectations:
  - "Assessment schedule and completed assessments at planned intervals"
  - "Trigger-based assessments for significant changes"
specializations:
  iso42001-2023: >
    Paired in 42001 with operational AI system impact assessment (its clause
    8.4) — an extension point on top of this core requirement.
tags: [risk, operations]
