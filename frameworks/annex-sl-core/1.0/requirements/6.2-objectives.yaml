id: annex-sl-core/1.0/6.2
framework: annex-sl-core
framework_version: "1.0"
ref: "6.2"
title: Objectives and planning to achieve them
type: clause
authority: certifiable
text_summary: >
  Establish measurable (where practicable) objectives at relevant
  functions and levels, consistent with the policy. Objectives are monitored,
  communicated and updated as needed, with plans covering what will be done,
  required resources, responsible persons, timelines and how results will be
  evaluated.
applicability:
  ai_roles: [all]
  min_maturity: L1
domains: [leadership-policy, monitoring-improvement]
evidence_expectations:
  - "Documented objectives with owners, metrics and target dates"
  - "Evidence of periodic progress review against objectives"
tags: [objectives]
