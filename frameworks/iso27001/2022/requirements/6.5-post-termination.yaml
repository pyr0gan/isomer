id: iso27001/2022/6.5
framework: iso27001
framework_version: "2022"
ref: "6.5"
title: Responsibilities after termination or change of employment
type: control
authority: certifiable
objective: "6"
text_summary: >
  Define, enforce and communicate security responsibilities that remain valid
  after termination or role change.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [resources-competence, identity-access]
evidence_expectations:
  - "Post-employment obligations in agreements; role-change access adjustments recorded"
tags: [hr, offboarding]
