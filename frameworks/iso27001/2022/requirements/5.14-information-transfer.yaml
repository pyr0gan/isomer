id: iso27001/2022/5.14
framework: iso27001
framework_version: "2022"
ref: "5.14"
title: Information transfer
type: control
authority: certifiable
objective: "5"
text_summary: >
  Establish transfer rules, procedures or agreements for all types of transfer
  within the organization and with external parties.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [data-governance, third-party]
evidence_expectations:
  - "Transfer procedures/agreements covering internal and external flows"
tags: [transfer]
