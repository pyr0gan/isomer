id: iso27001/2022/5.17
framework: iso27001
framework_version: "2022"
ref: "5.17"
title: Authentication information
type: control
authority: certifiable
objective: "5"
text_summary: >
  Control allocation and management of authentication information (secrets,
  keys, credentials) and advise personnel on proper handling.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [identity-access]
evidence_expectations:
  - "Credential/secret management procedure with secure issuance and storage"
  - "Secrets management tooling in use for system credentials"
tags: [credentials, secrets]
