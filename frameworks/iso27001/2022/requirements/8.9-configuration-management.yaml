id: iso27001/2022/8.9
framework: iso27001
framework_version: "2022"
ref: "8.9"
title: Configuration management
type: control
authority: certifiable
objective: "8"
text_summary: >
  Establish, document, implement, monitor and review secure configurations for
  hardware, software, services and networks.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [security-operations]
evidence_expectations:
  - "Hardening baselines with drift detection or periodic configuration review"
tags: [configuration]
