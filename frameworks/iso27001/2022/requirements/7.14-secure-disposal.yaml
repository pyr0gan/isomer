id: iso27001/2022/7.14
framework: iso27001
framework_version: "2022"
ref: "7.14"
title: Secure disposal or re-use of equipment
type: control
authority: certifiable
objective: "7"
text_summary: >
  Verify that sensitive data and licensed software are removed or securely
  overwritten before disposal or re-use of equipment.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [physical-environment, data-governance]
evidence_expectations:
  - "Sanitization/disposal records with verification"
tags: [disposal]
