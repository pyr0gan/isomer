id: iso27001/2022/5.27
framework: iso27001
framework_version: "2022"
ref: "5.27"
title: Learning from information security incidents
type: control
authority: certifiable
objective: "5"
text_summary: >
  Use knowledge from incidents to strengthen controls and reduce likelihood or
  impact of recurrence.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [security-operations, monitoring-improvement]
evidence_expectations:
  - "Post-incident reviews with control improvements traced to implementation"
tags: [incidents, improvement]
