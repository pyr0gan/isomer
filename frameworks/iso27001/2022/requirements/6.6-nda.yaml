id: iso27001/2022/6.6
framework: iso27001
framework_version: "2022"
ref: "6.6"
title: Confidentiality or non-disclosure agreements
type: control
authority: certifiable
objective: "6"
text_summary: >
  Identify, document, regularly review and enforce confidentiality/NDA terms
  reflecting the organization's protection needs.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [resources-competence, third-party]
evidence_expectations:
  - "Current NDA templates and signed records for personnel and external parties"
tags: [legal]
