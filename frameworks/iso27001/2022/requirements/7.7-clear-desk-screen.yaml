id: iso27001/2022/7.7
framework: iso27001
framework_version: "2022"
ref: "7.7"
title: Clear desk and clear screen
type: control
authority: certifiable
objective: "7"
text_summary: >
  Define and enforce clear desk rules for papers and removable media and clear
  screen rules for information processing facilities.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [physical-environment, responsible-use]
evidence_expectations:
  - "Clear desk/screen rules with technical enforcement (auto-lock) where feasible"
tags: [physical]
