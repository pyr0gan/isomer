id: iso27001/2022/5.22
framework: iso27001
framework_version: "2022"
ref: "5.22"
title: Monitoring, review and change management of supplier services
type: control
authority: certifiable
objective: "5"
text_summary: >
  Regularly monitor, review, evaluate and manage change in supplier security
  practice and service delivery.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [third-party, monitoring-improvement]
evidence_expectations:
  - "Supplier review cadence executed with findings and actions"
  - "Supplier change assessments recorded"
tags: [suppliers]
