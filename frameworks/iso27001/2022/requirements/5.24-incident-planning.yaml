id: iso27001/2022/5.24
framework: iso27001
framework_version: "2022"
ref: "5.24"
title: Incident management planning and preparation
type: control
authority: certifiable
objective: "5"
text_summary: >
  Plan and prepare for incident management: processes, roles, responsibilities
  and communication defined in advance.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [security-operations]
evidence_expectations:
  - "Incident response plan with roles and escalation paths"
  - "IR readiness exercise or test performed"
tags: [incidents]
