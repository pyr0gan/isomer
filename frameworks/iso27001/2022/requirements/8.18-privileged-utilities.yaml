id: iso27001/2022/8.18
framework: iso27001
framework_version: "2022"
ref: "8.18"
title: Use of privileged utility programs
type: control
authority: certifiable
objective: "8"
text_summary: >
  Restrict and tightly control utility programs capable of overriding system
  and application controls.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [identity-access, security-operations]
evidence_expectations:
  - "Inventory and restriction of privileged utilities with usage records"
tags: [access]
