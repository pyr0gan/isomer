id: iso27001/2022/5.5
framework: iso27001
framework_version: "2022"
ref: "5.5"
title: Contact with authorities
type: control
authority: certifiable
objective: "5"
text_summary: >
  Establish and maintain contact with relevant authorities (regulators, law
  enforcement, supervisory bodies) including when and by whom contact is made.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [leadership-policy, transparency-communication]
evidence_expectations:
  - "Authority contact register with responsibilities and triggers"
tags: [external]
