id: iso27001/2022/5.30
framework: iso27001
framework_version: "2022"
ref: "5.30"
title: ICT readiness for business continuity
type: control
authority: certifiable
objective: "5"
text_summary: >
  Plan, implement, maintain and test ICT readiness to meet continuity
  objectives and recovery requirements.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [resilience-continuity]
evidence_expectations:
  - "ICT continuity plans with RTO/RPO targets"
  - "Test/exercise results with follow-up actions"
tags: [continuity]
