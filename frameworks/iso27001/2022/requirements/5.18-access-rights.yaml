id: iso27001/2022/5.18
framework: iso27001
framework_version: "2022"
ref: "5.18"
title: Access rights
type: control
authority: certifiable
objective: "5"
text_summary: >
  Provision, review, modify and remove access rights per policy, on the basis
  of business need, with periodic review.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [identity-access]
evidence_expectations:
  - "Access provisioning records tied to approvals"
  - "Periodic access reviews with remediation of findings"
tags: [access]
