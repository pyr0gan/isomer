id: iso27001/2022/8.13
framework: iso27001
framework_version: "2022"
ref: "8.13"
title: Information backup
type: control
authority: certifiable
objective: "8"
text_summary: >
  Maintain and regularly test backups of information, software and systems per
  the agreed backup policy.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [resilience-continuity]
evidence_expectations:
  - "Backup policy with coverage evidence"
  - "Restore tests performed with results"
tags: [backup]
