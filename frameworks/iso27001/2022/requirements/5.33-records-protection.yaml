id: iso27001/2022/5.33
framework: iso27001
framework_version: "2022"
ref: "5.33"
title: Protection of records
type: control
authority: certifiable
objective: "5"
text_summary: >
  Protect records against loss, destruction, falsification, unauthorized
  access and release, per retention requirements.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [data-governance, monitoring-improvement]
evidence_expectations:
  - "Records retention schedule with protection controls applied"
tags: [records]
