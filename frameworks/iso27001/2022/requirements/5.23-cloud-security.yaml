id: iso27001/2022/5.23
framework: iso27001
framework_version: "2022"
ref: "5.23"
title: Information security for use of cloud services
type: control
authority: certifiable
objective: "5"
text_summary: >
  Establish processes for acquiring, using, managing and exiting cloud
  services per security requirements — including AI/ML platform services.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [third-party, security-operations]
evidence_expectations:
  - "Cloud service adoption/exit process with security requirements"
  - "Register of cloud services (incl. AI services) with responsibility split"
tags: [cloud]
