id: iso27001/2022/8.12
framework: iso27001
framework_version: "2022"
ref: "8.12"
title: Data leakage prevention
type: control
authority: certifiable
objective: "8"
text_summary: >
  Apply data leakage prevention measures to systems, networks and devices that
  process, store or transmit sensitive information.
applicability:
  ai_roles: [all]
  min_maturity: L3
domains: [data-governance, security-operations]
evidence_expectations:
