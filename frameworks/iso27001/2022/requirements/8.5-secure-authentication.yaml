id: iso27001/2022/8.5
framework: iso27001
framework_version: "2022"
ref: "8.5"
title: Secure authentication
type: control
authority: certifiable
objective: "8"
text_summary: >
  Implement secure authentication technologies and procedures per access
  restrictions and policy (MFA where warranted; workload authentication for
  non-human access).
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [identity-access]
evidence_expectations:
  - "MFA enforcement for user access to sensitive systems"
  - "Workload/service authentication mechanisms documented"
tags: [authentication, nhi]
