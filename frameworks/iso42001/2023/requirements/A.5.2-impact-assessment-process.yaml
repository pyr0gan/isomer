id: iso42001/2023/A.5.2
framework: iso42001
framework_version: "2023"
ref: "A.5.2"
title: AI system impact assessment process
type: control
authority: certifiable
objective: "A.5"
text_summary: >
  Establish a process for assessing the potential consequences of AI
  systems on individuals, groups and society across the system lifecycle,
  defining when assessments are triggered (new systems, significant
  changes), who performs them, and how results feed risk treatment.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [risk-impact]
evidence_expectations:
  - "Documented impact assessment procedure with triggers and responsibilities"
  - "Assessments demonstrably feeding the risk register and treatment decisions"
tags: [impact-assessment]
