id: iso42001/2023/A.8.3
framework: iso42001
framework_version: "2023"
ref: "A.8.3"
title: External reporting
type: control
authority: certifiable
objective: "A.8"
text_summary: >
  Provide means for interested parties to report adverse impacts or
  concerns about the organization's AI systems, and define how such
  reports are received, assessed and acted on.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [transparency-communication, responsible-use]
evidence_expectations:
  - "Externally accessible reporting channel with documented handling process"
tags: [transparency, feedback]
