id: iso42001/2023/A.6.2.4
framework: iso42001
framework_version: "2023"
ref: "A.6.2.4"
title: AI system verification and validation
type: control
authority: certifiable
objective: "A.6"
text_summary: >
  Define and document verification and validation measures for AI
  systems and the criteria for applying them: test methodology,
  evaluation datasets, acceptance criteria against specified
  requirements (including responsible-AI requirements), and release
  criteria.
applicability:
  ai_roles: [provider, developer]
  min_maturity: L2
domains: [ai-lifecycle]
evidence_expectations:
  - "Documented V&V plan per system with acceptance criteria"
  - "Test results traceable to requirements, including fairness/robustness checks"
  - "Release decisions referencing V&V outcomes"
tags: [lifecycle, testing]
