id: iso42001/2023/A.4.3
framework: iso42001
framework_version: "2023"
ref: "A.4.3"
title: Data resources
type: control
authority: certifiable
objective: "A.4"
text_summary: >
  Document the data resources used by AI systems: origin and collection
  method, categories (including any personal or sensitive data),
  intended use, ownership, and known quality characteristics or
  limitations.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [data-governance, resources-competence]
evidence_expectations:
  - "Data resource records per AI system covering provenance, categories and ownership"
  - "Personal/sensitive data flagged and linked to privacy obligations"
tags: [data]
