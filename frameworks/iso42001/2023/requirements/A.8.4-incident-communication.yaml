id: iso42001/2023/A.8.4
framework: iso42001
framework_version: "2023"
ref: "A.8.4"
title: Communication of incidents
type: control
authority: certifiable
objective: "A.8"
text_summary: >
  Determine and document how AI system incidents are communicated to
  affected users and other interested parties: thresholds, timing,
  content, channels and responsibilities — aligned with any legal
  notification duties.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [transparency-communication]
evidence_expectations:
  - "Incident communication plan with thresholds and responsibilities"
  - "Alignment with regulatory notification obligations documented"
tags: [incidents, communication]
