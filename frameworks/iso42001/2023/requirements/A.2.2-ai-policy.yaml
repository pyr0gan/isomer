id: iso42001/2023/A.2.2
framework: iso42001
framework_version: "2023"
ref: "A.2.2"
title: AI policy
type: control
authority: certifiable
objective: "A.2"
text_summary: >
  Document a policy governing the development or use of AI systems,
  informed by business strategy, organizational values, risk appetite,
  and the regulatory environment. The policy states principles the
  organization commits to and directs how AI activity is governed.
applicability:
  ai_roles: [all]
  min_maturity: L1
domains: [leadership-policy]
evidence_expectations:
  - "Approved AI policy referencing strategy, values and applicable regulation"
  - "Policy identifies the AI principles the organization commits to"
tags: [policy]
