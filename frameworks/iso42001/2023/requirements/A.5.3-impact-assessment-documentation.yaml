id: iso42001/2023/A.5.3
framework: iso42001
framework_version: "2023"
ref: "A.5.3"
title: Documentation of AI system impact assessments
type: control
authority: certifiable
objective: "A.5"
text_summary: >
  Document impact assessment results and retain them for a defined
  period, so conclusions, assumptions and mitigations are available to
  reviewers, auditors and (where appropriate) affected parties.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [risk-impact, monitoring-improvement]
evidence_expectations:
  - "Retained impact assessment records with defined retention period"
  - "Assessment records versioned against system changes"
tags: [impact-assessment, records]
