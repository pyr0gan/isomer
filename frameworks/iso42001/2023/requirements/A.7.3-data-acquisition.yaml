id: iso42001/2023/A.7.3
framework: iso42001
framework_version: "2023"
ref: "A.7.3"
title: Acquisition of data
type: control
authority: certifiable
objective: "A.7"
text_summary: >
  Determine and document how data for AI systems is acquired and
  selected: sources, selection criteria, rights and legal basis to use
  the data, and any constraints attached to it.
applicability:
  ai_roles: [provider, developer]
  min_maturity: L2
domains: [data-governance, third-party]
evidence_expectations:
  - "Acquisition records covering source, selection rationale and usage rights"
tags: [data, sourcing]
