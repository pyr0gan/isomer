id: iso42001/2023/A.10.2
framework: iso42001
framework_version: "2023"
ref: "A.10.2"
title: Allocating responsibilities
type: control
authority: certifiable
objective: "A.10"
text_summary: >
  Ensure responsibilities in the AI supply chain are defined and
  allocated between the organization, its suppliers, partners and
  customers — covering development, data, deployment, monitoring,
  incident handling and compliance duties — so nothing falls into the
  gap between parties.
applicability:
  ai_roles: [all]
  min_maturity: L2
domains: [third-party]
evidence_expectations:
  - "Documented responsibility allocation (e.g. contracts, shared-responsibility matrices) per supply-chain relationship"
tags: [supply-chain, contracts]
