domain: identity-access
version: "1.0"
questions:
  - id: ia-01
    level: L1
    ask: "Do access control rules exist, with unique identities per user and offboarding that removes access?"
    kind: boolean
    evidence_prompt: "Attach the access policy and an offboarding record showing removal."
    requirements:
      - iso27001/2022/5.15
      - iso27001/2022/5.16
  - id: ia-02
    level: L2
    ask: "Is there an inventory of non-human identities (service accounts, workload identities, agent identities) with owners and justification?"
    kind: boolean
    evidence_prompt: "Attach the NHI inventory with ownership."
    requirements:
      - iso27001/2022/5.16
  - id: ia-03
    level: L2
    ask: "Are system credentials in secrets management, with MFA enforced on sensitive user access?"
    kind: boolean
    evidence_prompt: "Attach secrets tooling evidence and MFA enforcement configuration."
    requirements:
      - iso27001/2022/5.17
      - iso27001/2022/8.5
  - id: ia-04
    level: L2
    ask: "Do periodic access reviews run, including privileged access, with findings remediated?"
    kind: boolean
    evidence_prompt: "Attach the last review with remediation records."
    requirements:
      - iso27001/2022/5.18
      - iso27001/2022/8.2
