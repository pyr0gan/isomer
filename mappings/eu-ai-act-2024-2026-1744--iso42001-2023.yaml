    to: annex-sl-core/1.0/5.1
    relation: related
    strength: weak
    reviewed: 2026-08-08
    reviewer: claude-draft
  - from: eu-ai-act/2024+2026-1744/art-17
    to: annex-sl-core/1.0/4.4
    relation: partially_satisfied_by
    strength: strong
    note: >
      A 42001-conformant AIMS is substantively the Art. 17 QMS: management
      system, risk management, data management, monitoring, incident
      handling, records, accountability all present. Gap: map AIMS elements
      to the Art. 17(1) enumerated items and close the deltas (regulatory
      compliance strategy, conformity assessment procedures, authority
      communication).
    reviewed: 2026-08-08
    reviewer: claude-draft
