  # ---- art 26 deployer duties ----
  - from: eu-ai-act/2024+2026-1744/art-26
    to: iso42001/2023/A.9.4
    relation: partially_satisfied_by
    strength: strong
    note: >
      Use-per-intended-purpose monitoring is the same control as
      use-per-instructions; the Act adds suspend-and-inform-provider on
      identified risk and worker information before workplace deployment.
      Gap: suspension procedure + worker information records.
    reviewed: 2026-08-08
    reviewer: claude-draft
  - from: eu-ai-act/2024+2026-1744/art-26
    to: iso42001/2023/A.6.2.6
    relation: partially_satisfied_by
    strength: moderate
    note: >
      Operational monitoring covers the deployer's watch duty; the Act
      scopes it to the deployer's control sphere incl. input data relevance
      and representativeness. Gap: input-data suitability checks where
      deployer controls inputs.
    reviewed: 2026-08-08
    reviewer: claude-draft
  - from: eu-ai-act/2024+2026-1744/art-26
    to: iso42001/2023/A.6.2.8
    relation: partially_satisfied_by
    strength: moderate
    note: >
      Log retention machinery exists; the Act sets a minimum period (at
      least six months, subject to other law) for logs under deployer
      control. Gap: retention period compliance.
    reviewed: 2026-08-08
    reviewer: claude-draft
  - from: eu-ai-act/2024+2026-1744/art-26
    to: iso42001/2023/A.3.2
    relation: related
